<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgeMate: Age &amp; Birthday Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>AgeMate</span>
  </header>

  <main>
    <h1>Discover your age.</h1>
    <p class="intro">Calculate your exact age and see how long until your next birthday.</p>

    <section class="card">
      <form id="ageForm" novalidate>
        <label for="dob">Date of birth</label>
        <input type="date" id="dob" min="1900-01-01" aria-describedby="error">
        <p class="error" id="error" role="alert"></p>
        <div class="actions">
          <button type="submit" class="primary">Calculate Age</button>
          <button type="button" id="resetBtn" class="ghost">Reset</button>
        </div>
      </form>

      <div id="results" aria-live="polite" hidden>
        <div class="age">
          <div><strong id="years"></strong><span>Years</span></div>
          <div><strong id="months"></strong><span>Months</span></div>
          <div><strong id="days"></strong><span>Days</span></div>
        </div>
        <dl class="details">
          <div><dt>Total days lived</dt><dd id="totalDays"></dd></div>
          <div><dt>Total weeks lived</dt><dd id="totalWeeks"></dd></div>
          <div><dt>Next birthday</dt><dd id="nextDate"></dd></div>
          <div><dt>Time until then</dt><dd id="daysLeft"></dd></div>
        </dl>
      </div>
    </section>
  </main>

  <footer>AgeMate works offline. Your date never leaves this page.</footer>
  <script src="script.js"></script>
</body>
</html>
